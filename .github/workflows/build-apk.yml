name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Construir APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      - name: Verificar Gradle Wrapper
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Executar testes
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Construir APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          mkdir -p artifact
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          test -n "$APK_PATH"
          SHORT_SHA="${GITHUB_SHA::7}"
          cp "$APK_PATH" "artifact/Dyno-Lite-v1.0.3-${SHORT_SHA}.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dyno-Lite-v1.0.3-${{ github.sha }}
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 30
